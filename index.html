<!doctype html>
<html lang="es-MX" data-study-version="maze-v1" data-study-only="true">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/src/assets/logoBTC.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <script>
      // O protótipo é uma interface mobile fechada: bloqueia o zoom por pinça
      // que o Safari iOS ainda permite mesmo com user-scalable=no.
      document.addEventListener('gesturestart', function (event) {
        event.preventDefault()
      }, { passive: false })
      document.addEventListener('gesturechange', function (event) {
        event.preventDefault()
      }, { passive: false })
      document.addEventListener('gestureend', function (event) {
        event.preventDefault()
      }, { passive: false })
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,400;0,500;0,700;0,900;1,900&family=Red+Hat+Text:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!--
      MAZE_SNIPPET

      Área reservada ao snippet oficial da conta do Maze. O código NÃO é escrito
      à mão aqui: o plugin `mazeSnippet` do `vite.config.ts` substitui este
      marcador pelo conteúdo de `maze/snippet.html` quando o build roda com
      `VITE_MAZE_ENABLED=true`. Sem essa variável o marcador some e nenhum script
      externo entra no bundle, que é o comportamento do build local e dos testes.

      Ver docs/MAZE_SETUP.md para onde obter o snippet e como confirmar que ele
      carregou nas quatro URLs.
    -->
    <title>Draftea Pulse | Estudio de usabilidad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
