name: Deploy Pulse Maze Study

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  STUDY_VERSION: maze-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          pnpm test:chart
          pnpm test:market
          pnpm test:wallet
          pnpm test:entries
          pnpm test:help
          pnpm test:assets

      - name: Lint
        run: pnpm lint

      # O snippet oficial do Maze só entra quando a variável do repositório o
      # habilita e o arquivo está preenchido. Sem isso o build sai limpo, que é
      # o estado correto para uma verificação de pull request.
      - name: Prepare Maze snippet
        id: maze
        env:
          MAZE_SNIPPET: ${{ vars.PULSE_MAZE_SNIPPET }}
        run: |
          if [ -n "$MAZE_SNIPPET" ]; then
            printf '%s\n' "$MAZE_SNIPPET" > maze/snippet.html
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Snippet do Maze não configurado; o build sai sem instrumentação."
          fi

      - name: Build research artifact
        env:
          VITE_BASE_PATH: ${{ vars.PULSE_MAZE_BASE_PATH || '/pulse-maze-study/' }}
          VITE_MAZE_ENABLED: ${{ steps.maze.outputs.enabled }}
        run: pnpm build

      # A auditoria roda contra o `dist` recém-gerado, então ela reprova um
      # deploy que reintroduza qualquer endpoint de mercado, mesmo por engano.
      - name: Study suites and bundle audit
        run: pnpm test:study

      - name: Expose study version
        run: |
          echo "$STUDY_VERSION" > dist/STUDY_VERSION
          echo "commit=$GITHUB_SHA" >> dist/STUDY_VERSION

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
